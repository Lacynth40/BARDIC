project:
  name: "BARDIC"
  description: "Base-level Agent for Retrieval, Discourse, and Internal Consistency"
  seed: 42

directories:
  raw_data: "data/raw"
  processed_data: "data/processed"
  models: "models/"
  logs: "experiments/logs"

rag_encoder:
  source: "wikipedia"
  embedding_model: "all-MiniLM-L6-v2"
  chunk_size_words: 100
  top_k_retrievals: 2
  summary_max_words: 100
  num_line_titles: 4

poet_decoder:
  model_name: "models/bardic_base"
  max_source_length: 256
  max_target_length: 128

  max_new_tokens: 80
  temperature: 0.95
  top_p: 0.92
  num_attempts: 24

  debug: true

  semantic_encoder_model: "all-MiniLM-L6-v2"
  semantic_encoder_device: "cpu"

bardic_constraints:
  output_type: "quatrain"
  lines_per_stanza: 4
  num_stanzas: 1
  allowed_rhyme_schemes:
    - "ABAB"
  target_syllables_per_line: 10
  use_hidden_titles: true

reinforce_training:
  epochs: 20
  batch_size: 8
  learning_rate: 1.0e-5
  critic_thresholds:
    min_consistency_score: 0.75
    max_retry_attempts: 5
services:
  bardic-agent:
    build: .
    container_name: bardic-agent
    stdin_open: true # <--- Connects your keyboard (interactive mode)
    tty: true        # <--- Allows for the text prompt to show up
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - PYTHONUNBUFFERED=1 # <--- Forces logs to show up instantly